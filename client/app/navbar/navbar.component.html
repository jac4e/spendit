<header>
  <!-- Badge (optional decorative element) -->
  <div class="badge rounded-pill text-bg-primary"></div>

  <!-- Main Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light mb-3">
    <div class="container py-2 mt-2 bg-ui-main round">
      
      <!-- Brand -->
      <div class="col-sm-auto col-12">
        <a class="navbar-brand">{{ brand.name }}</a>
      </div>
      
      <!-- User Balance / Admin Mode -->
      <div class="col-auto">
        <!-- Logged in non-admin users see their balance -->
        <span *ngIf="tabGuard(['loggedIn', 'notAdmin'])" class="balance navbar-text">
          <a 
            class="btn btn-icon btn-{{ isZero(account?.balance) ? 'danger' : 'primary' }}" 
            href="/account/refill">
            {{ account?.username }}: {{ account?.balance }} PHYC
          </a>
        </span>
        <!-- Admin users see a different option -->
        <span *ngIf="tabGuard(['admin'])" class="balance navbar-text">
          <a class="btn btn-icon btn-{{ isZero(account?.balance) ? 'danger' : 'primary' }}">
            Admin Mode
          </a>
        </span>
      </div>
      
      <!-- Desktop Navigation -->
      <div class="d-none d-lg-flex justify-content-end col-12 col-lg-8">
        <ul ngbNav [(activeId)]="url" #nav="ngbNav" class="nav-pills">
          <ng-container *ngFor="let link of links">
            <li *ngIf="tabGuard(link.guards)" [ngbNavItem]="link.route">
              <a ngbNavLink [routerLink]="link.route">{{ link.title }}</a>
            </li>
          </ng-container>
          <!-- Logout Link for logged-in users -->
          <li class="nav-item">
            <a *ngIf="tabGuard(['loggedIn'])" (click)="logout()" class="nav-link">
              Logout
            </a>
          </li>
        </ul>

        <!-- Cart Button -->
        <button *ngIf="account"
                type="button"
                title="cart"
                class="btn btn-icon {{ isCartCollapsed ? 'btn-outline-primary' : 'btn-primary' }}"
                (click)="isCartCollapsed = !isCartCollapsed">
          <ng-icon name="dripBasket"></ng-icon>
          <span class="badge rounded-pill bg-danger" *ngIf="cartLength > 0">
            {{ cartLength }}
          </span>
        </button>
      </div>
      
      <!-- Mobile Navigation Buttons -->
      <div class="d-lg-none col-auto btn-group" role="group">
        <!-- Cart Button -->
        <button *ngIf="account"
                type="button"
                title="cart"
                class="btn btn-icon {{ isCartCollapsed ? 'btn-outline-primary' : 'btn-primary' }}"
                (click)="isCartCollapsed = !isCartCollapsed">
          <ng-icon name="dripBasket"></ng-icon>
          <span class="badge rounded-pill bg-danger" *ngIf="cartLength > 0">
            {{ cartLength }}
          </span>
        </button>
        <!-- Menu Toggle Button -->
        <button type="button"
                class="btn btn-icon {{ isMenuCollapsed ? 'btn-outline-primary' : 'btn-primary' }}"
                (click)="isMenuCollapsed = !isMenuCollapsed">
          <ng-icon name="dripMenu"></ng-icon>
        </button>
      </div>
      
      <!-- Mobile Collapsible Menu -->
      <div #collapse="ngbCollapse"
           [(ngbCollapse)]="isMenuCollapsed"
           class="d-lg-none col-12">
        <ul ngbNav [(activeId)]="url" #nav="ngbNav" class="mt-3 nav-pills nav-fill">
          <ng-container *ngFor="let link of links">
            <li *ngIf="tabGuard(link.guards)" class="nav-item-tab" [ngbNavItem]="link.route">
              <a ngbNavLink [routerLink]="link.route">{{ link.title }}</a>
            </li>
          </ng-container>
          <li *ngIf="tabGuard(['loggedIn'])" class="nav-item-tab">
            <a class="nav-link" (click)="logout()">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- Global Alerts -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
  <app-common-alerts></app-common-alerts>
</div>

<!-- Collapsible Cart Container -->
<div *ngIf="account" class="container">
  <div class="card" #collapse="ngbCollapse" [(ngbCollapse)]="isCartCollapsed">
    <div class="card-body">
      <app-cart></app-cart>
    </div>
  </div>
</div>
